# Local development database ONLY. Not for production (see chunk 41).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: emr
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - emr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d emr"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  emr_pgdata:
